services:
  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arms_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    networks:
      - arms_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arms_frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - arms_network
    restart: unless-stopped

networks:
  arms_network:
    driver: bridge
server.port=8080

# Disable PostgreSQL/JPA - using Firebase instead
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# File upload settings
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# CORS settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80}

# JWT settings (for token validation if needed)
app.jwt.secret=${JWT_SECRET:RmG9cgqAXayWN1SLhNOWdZmOHQ821Sq41FVZ01kO3XZehLBI0vpDOWw633qiAEkfusVBNYCWffXUTmRldRqw}

# Firebase settings
firebase.project.id=${FIREBASE_PROJECT_ID:arms-8a8b8}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:arms-8a8b8.firebasestorage.app}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-credentials.json}

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always